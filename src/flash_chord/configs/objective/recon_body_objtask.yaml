# The challenge's ReconBody objective plus the object-tracking reward (objectives/recon_body.py, term `object_task`),
# per control step:
#   object_task = exp(-object_task_position_beta * |p - p_ref|) * exp(-object_task_rotation_beta * angle(q, q_ref))
# on the object root body, |.| in metres (Euclidean norm, not squared), angle = 2 asin(|vec(q conj(q_ref))|) in
# radians. It is the object-tracking reward of the DexMachina suite, whose articulation factor is exactly 1 for the
# rigid objects of the challenge. The term is weighted like every other term: score += frame_dt * weight * object_task.
#
# A non-zero object_task_weight creates the term (a 13th objective term and a reward_components/object_task_* log
# key); 0, the dataclass default and what objective/recon_body.yaml implies, is the unchanged objective of the
# challenge. The curriculum stage weight is what training applies (set every iteration), so every curriculum stage
# must carry `object_task` too (curriculum/recon_body_rsi_objtask.yaml); a missing or extra key fails at the first
# iteration. The paper's experiments set the scales to 10 per metre and 1 per radian
# (experiment/g1_recon_body_coord_rsi_r2.yaml).
defaults:
  - recon_body
  - _self_

object_task_weight: 5.0
object_task_position_beta: 20.0
object_task_rotation_beta: 5.0
