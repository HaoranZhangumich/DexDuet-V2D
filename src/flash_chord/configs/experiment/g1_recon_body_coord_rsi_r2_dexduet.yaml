# @package _global_

# DexDuet on the V2D challenge (G1 + Dex3): experiment/g1_recon_body_coord_rsi_r2.yaml plus the hand graph reward and
# the hand-object contact reward (objectives/dexduet.py). Only these differ from it:
#   /objective   recon_body_objtask -> recon_body_objtask_dexduet          (hand_graph 2.5, ho_contact 5.0 + parameters)
#   /curriculum  recon_body_rsi_objtask -> recon_body_rsi_objtask_dexduet  (+ hand_graph: 2.5, ho_contact: 5.0)
#   logging.experiment / logging.run_name
# The paper's runs pass training.max_iterations=20000 (at most 1,966,080,000 environment steps, the budget of every
# method) and objective.dexduet_targets_dir=<dir>, the folder of the human targets (reproduce/train.sh).
# tests/coordinate/test_dexduet_configs.py fails on any other difference. The rest of this header is that of
# experiment/g1_recon_body_coord_rsi_r2.yaml.
#
# Object-tracking reward (added to the challenge's twelve reward terms; objectives/recon_body.py, term `object_task`):
#   object_task = exp(-object_task_position_beta * |p - p_ref|) * exp(-object_task_rotation_beta * angle(q, q_ref))
# on the object root body, |.| in metres (not squared), angle = 2 asin(|vec(q conj(q_ref))|) in radians;
# score += frame_dt * 5.0 * object_task. It is the object-tracking reward of the DexMachina suite, whose
# articulation factor is exactly 1 for the rigid objects of the challenge.
#   The weight 5.0 is set in two places, by the paired group files below: objective/recon_body_objtask.yaml (a
#     non-zero object_task_weight creates the term) and curriculum/recon_body_rsi_objtask.yaml (the stage weight that
#     training applies every iteration). Setting only one of them fails at the first iteration.
#   Scales 10 per metre and 1 per radian, as on the DexMachina suite, set in `objective:` below so that the
#     checkpoint config records them. At these scales the term is 0.74 at 3 cm and 0.61 at 0.5 rad. With frame_dt
#     0.02 it adds up to 0.10 per step to the recipe's positive maximum of 0.32; the termination penalty
#     (-300 x 0.02) is unchanged.
#   The export to the official policy format strips the three object_task_* fields and the curriculum weight, which
#     the official runtime would reject; the exported actor and its config are unaffected.
#
# A-RSI timers, converted by samples. An update on the DexMachina suite collects 12,000 environments x 32 steps =
# 384,000 samples, and an iteration of the challenge's PPO recipe 4,096 worlds x 24 steps = 98,304 samples, so one
# update corresponds to 384,000 / 98,304 = 3.90625 iterations:
#   reset.wait_iterations               100  -> 391
#   reset.min_gap                       40   -> 156
#   reset.deadline                      9000 -> 35156
#   reset.zero_ramp                     1000 -> 3906    every segment at zero assistance by iteration 39,062
#   training.early_stop_help_zero_tail  1500 -> 5860
#   training.max_iterations 45000: an upper bound; with the deadline, every run stops by 39,062 + 5,860 = 44,922.
#     The paper's runs pass training.max_iterations=20000: at most 1,966,080,000 environment steps, the budget of
#     every method (reproduce/train.sh).
# The evaluated checkpoint is the final one, named by final.json.
# Everything else in reset/recon_body_rsi.yaml is unchanged (segments of 25 frames, keyframes, a quarter of the
# starts at the first frame). The curriculum (curriculum/recon_body_rsi_objtask.yaml) has one stage with the recipe's
# weights and `object_task: 5.0`; A-RSI sets the assistance.

defaults:
  - override /sim: recon_body
  - override /collision: physical
  - override /embodiment: g1_dex3
  - override /action: sonic_joint_residual
  - override /observation: recon_body
  - override /objective: recon_body_objtask_dexduet # + hand_graph 2.5, ho_contact 5.0
  - override /termination: recon_body
  - override /reset: recon_body_rsi
  - override /curriculum: recon_body_rsi_objtask_dexduet  # + hand_graph, ho_contact

# Object-tracking reward scales (header): 10 per metre, 1 per radian. The weight (5.0) comes from the paired
# group files above.
objective:
  object_task_position_beta: 10.0
  object_task_rotation_beta: 1.0

# A-RSI timers converted by samples (header). The other reset fields come from reset/recon_body_rsi.yaml.
reset:
  wait_iterations: 391
  min_gap: 156
  deadline: 35156
  zero_ramp: 3906

task:
  motion_speed: 1.0
  source_frame_playback: true
  motion_start_frame: 0
  motion_end_frame: -1

scene:
  world_count: 4096
  contact_friction: 1.0
  object_free_joint_damping: 0.01

action:
  input_mode: raw
  normalized_mapping: linear

env:
  voc:
    _target_: flash_chord.runtime.object_control.VOCParams
    k_lin: 50.0
    d_lin: 10.0
    k_ang: 10.0
    d_ang: 0.1
    max_force: 60.0
    max_torque: 60.0
    gravity: 9.81
    mass_normalized_gains: false
  contact:
    _target_: flash_chord.runtime.contact.ContactTrackerConfig
    sides: [left, right]
  capture_terminal_state: false
  enforce_joint_velocity_limits: true
  critic_context:
    _target_: flash_chord.envs.rl.CriticContextConfig
    reference_phase: false
    object_body_velocity: false

# Match G1SonicRslRlPpoCfg, then retain both deployment-exact and uniform
# recovery starts through the terminal checkpoint.
training:
  rollout_steps: 24
  max_iterations: 45000
  # Early stop: 5860 iterations after every segment has reached zero assistance (final.json).
  early_stop_help_zero_tail: 5860
  save_interval: 500
  observation_normalization: true
  observation_normalization_epsilon: 0.01
  reward_normalization: false
  resume: false
  checkpoint: null
  network:
    actor_hidden_dims: [1024, 512, 256, 128]
    critic_hidden_dims: [1024, 512, 256, 128]
    activation: elu
    initial_noise_std: 0.5
    noise_std_type: scalar
    actor_output_gain: 0.0
  ppo:
    value_loss_coefficient: 1.0
    use_clipped_value_loss: true
    clip_parameter: 0.2
    entropy_coefficient: 0.0005
    learning_epochs: 5
    mini_batches: 4
    learning_rate: 0.0005
    schedule: adaptive
    minimum_learning_rate: 0.00001
    maximum_learning_rate: 0.01
    adaptive_schedule_factor: 1.5
    discount: 0.99
    gae_lambda: 0.95
    desired_kl: 0.02
    max_grad_norm: 0.1
    normalize_advantage_per_mini_batch: false
    log_ratio_clip: null

  # Per-hand policies. Every CoordinateConfig field is explicit. The per-hand actor ignores
  # network.actor_hidden_dims; the central critic with one value head per policy uses
  # network.critic_hidden_dims. The export to the official policy format embeds the actor into the plain
  # [1024, 1024, 768, 384] MLP named by export_actor_hidden_dims (it uses [640, 576, 768, 384] of it).
  coordinate:
    _target_: flash_chord.training.ppo.config.CoordinateConfig
    agents: [left, right, body]
    encoder_dim: 128
    partner_dim: 64
    message_dim: 64
    trunk_dims: [256, 128]
    partner_message: true
    mirror_body_message: true
    hand_world_terms: reflect
    ratio_mode: per_agent
    value_mode: per_agent
    export_actor_hidden_dims: [1024, 1024, 768, 384]

logging:
  experiment: g1_sonic_recon_body_coord_rsi_r2_dexduet
  run_name: g1_recon_body_coord_rsi_r2_dexduet
  log_interval: 10
