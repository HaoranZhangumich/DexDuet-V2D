# @package _global_

# Intermediate experiment: experiment/g1_recon_body_coord_rsi.yaml (per-hand policies + A-RSI, FlashCHORD VOC)
# with ONE change, a larger per-hand actor, the size used by DexDuet's two experiments:
#   training.coordinate.encoder_dim               96 -> 128
#   training.coordinate.trunk_dims                [80, 40] -> [256, 128]
#   training.coordinate.export_actor_hidden_dims  [1024, 512, 256, 128] -> [1024, 1024, 768, 384]
#   (partner_dim 64 and message_dim 64 are unchanged), plus its own logging names.
# The actor has 228,168 parameters (shared hand network 114,638, body network 113,487, 43 log_std), against
# 81,952 in g1_recon_body_coord_rsi.yaml. Its export to the official policy format needs [640, 576, 768, 384]
# units in the four stock actor layers, which does not fit [1024, 512, 256, 128], so the exported plain MLP
# widens to [1024, 1024, 768, 384]. The official evaluator builds the actor widths from the checkpoint's own
# config, so it needs no change. Critic widths, PPO, reset, curriculum, env and scene equal
# g1_recon_body_coord_rsi.yaml.
# Self-contained copy of experiment/g1_recon_body_coord_rsi.yaml (no nested experiment
# inheritance, which would duplicate the /reset override). Keep it in sync with that file;
# tests/coordinate/test_experiment_configs.py fails on any other difference.
defaults:
  - override /sim: recon_body
  - override /collision: physical
  - override /embodiment: g1_dex3
  - override /action: sonic_joint_residual
  - override /observation: recon_body
  - override /objective: recon_body
  - override /termination: recon_body
  - override /reset: recon_body_rsi
  - override /curriculum: recon_body_rsi

task:
  motion_speed: 1.0
  source_frame_playback: true
  motion_start_frame: 0
  motion_end_frame: -1

scene:
  world_count: 4096
  contact_friction: 1.0
  object_free_joint_damping: 0.01

action:
  input_mode: raw
  normalized_mapping: linear

env:
  voc:
    _target_: flash_chord.runtime.object_control.VOCParams
    k_lin: 50.0
    d_lin: 10.0
    k_ang: 10.0
    d_ang: 0.1
    max_force: 60.0
    max_torque: 60.0
    gravity: 9.81
    mass_normalized_gains: false
  contact:
    _target_: flash_chord.runtime.contact.ContactTrackerConfig
    sides: [left, right]
  capture_terminal_state: false
  enforce_joint_velocity_limits: true
  critic_context:
    _target_: flash_chord.envs.rl.CriticContextConfig
    reference_phase: false
    object_body_velocity: false

# Match G1SonicRslRlPpoCfg, then retain both deployment-exact and uniform
# recovery starts through the terminal checkpoint.
training:
  rollout_steps: 24
  max_iterations: 20000
  save_interval: 500
  observation_normalization: true
  observation_normalization_epsilon: 0.01
  reward_normalization: false
  resume: false
  checkpoint: null
  network:
    actor_hidden_dims: [1024, 512, 256, 128]
    critic_hidden_dims: [1024, 512, 256, 128]
    activation: elu
    initial_noise_std: 0.5
    noise_std_type: scalar
    actor_output_gain: 0.0
  ppo:
    value_loss_coefficient: 1.0
    use_clipped_value_loss: true
    clip_parameter: 0.2
    entropy_coefficient: 0.0005
    learning_epochs: 5
    mini_batches: 4
    learning_rate: 0.0005
    schedule: adaptive
    minimum_learning_rate: 0.00001
    maximum_learning_rate: 0.01
    adaptive_schedule_factor: 1.5
    discount: 0.99
    gae_lambda: 0.95
    desired_kl: 0.02
    max_grad_norm: 0.1
    normalize_advantage_per_mini_batch: false
    log_ratio_clip: null

  # Per-hand policies (training/ppo/coordinate/). Every
  # CoordinateConfig field is explicit. The coordinated actor ignores
  # network.actor_hidden_dims; the K-column central critic uses
  # network.critic_hidden_dims. The export to the official policy format embeds the actor into the plain
  # [1024, 1024, 768, 384] MLP named by export_actor_hidden_dims (uses
  # [640, 576, 768, 384] of it). Only encoder_dim, trunk_dims and
  # export_actor_hidden_dims differ from g1_recon_body_coord_rsi.yaml.
  coordinate:
    _target_: flash_chord.training.ppo.config.CoordinateConfig
    agents: [left, right, body]
    encoder_dim: 128
    partner_dim: 64
    message_dim: 64
    trunk_dims: [256, 128]
    partner_message: true
    mirror_body_message: true
    hand_world_terms: reflect
    ratio_mode: per_agent
    value_mode: per_agent
    export_actor_hidden_dims: [1024, 1024, 768, 384]

logging:
  experiment: g1_sonic_recon_body_coord_rsi_wide
  run_name: g1_recon_body_coord_rsi_wide
  log_interval: 10
