_target_: flash_chord.configuration.make_fixed_curriculum

# curriculum/recon_body_rsi_objtask.yaml plus the weights of DexDuet's two interaction rewards
# (objective/recon_body_objtask_dexduet.yaml): hand_graph 2.5 and ho_contact 5.0, constant (one stage, no decay).
# Identical otherwise: voc_scale 0.0 (A-RSI sets the assistance), the twelve recon_body_ppo.yaml weights,
# object_task 5.0, and the 20,000 terminal sentinel.
thresholds: [20000]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
      object_task: 5.0
      hand_graph: 2.5
      ho_contact: 5.0
